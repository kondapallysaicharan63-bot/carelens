name: ci
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: System libraries for mediapipe / opencv
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgles2 ffmpeg
      - run: pip install -r requirements.txt
      - run: python -m pytest -q -rfE --durations=10
      - name: Fixture freshness
        run: python -m carelens.fixtures --check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect web project
        id: web
        run: |
          if [ -f web/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "web/package.json missing: skipping web job"; echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.web.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: "Install, typecheck, build, test (build first, tests check dist/)"
        if: steps.web.outputs.present == 'true'
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test

  e2e:
    # Real-browser tests (Playwright + Chromium with synthetic fake camera/microphone media); separate from the unit job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: numpy for the accuracy round trip (carelens.accuracy needs numpy only)
        run: pip install numpy
      - name: Cache the pinned model files (key = hash of the fetch script, which pins the SHA-256s)
        uses: actions/cache@v4
        with:
          path: web/public/models
          key: models-${{ hashFiles('web/scripts/fetch-models.mjs') }}
      - name: Install, fetch models (SHA-256 checked), build the e2e bundle
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run fetch-models
          npm run build:e2e
      - name: End-to-end tests
        working-directory: web
        env:
          PYTHON: python
        run: npm run e2e
